<!DOCTYPE html>
<html>
<head>
  <title>My Tiny Game</title>
  <style>
    body {
      font-family: monospace;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #111;
      color: #eee;
    }

    button {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      background: #222;
      color: white;
      border: 1px solid #555;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }
  </style>
</head>

<body>

  <h1>THE DOOR</h1>

  <p id="text">
    You wake up in a dark room.
    There is a door in front of you.
  </p>

  <div id="buttons">
    <button onclick="openDoor()">Open the door</button>
    <button onclick="wait()">Wait</button>
  </div>

  <script>
    function openDoor() {
      document.getElementById("text").innerText =
        "You open the door. There is a chicken standing outside. It looks at you.";

      document.getElementById("buttons").innerHTML =
        '<button onclick="talk()">Talk to the chicken</button>' +
        '<button onclick="run()">Run away</button>';
    }

    function wait() {
      document.getElementById("text").innerText =
        "You wait... Nothing happens. Then you hear a knock behind you.";

      document.getElementById("buttons").innerHTML =
        '<button onclick="turnAround()">Turn around</button>';
    }

    function talk() {
      document.getElementById("text").innerText =
        "The chicken says: \"You have made an excellent choice.\" YOU WIN.";

      document.getElementById("buttons").innerHTML =
        '<button onclick="location.reload()">Play again</button>';
    }

    function run() {
      document.getElementById("text").innerText =
        "You run away. You trip over a rock. The chicken judges you.";

      document.getElementById("buttons").innerHTML =
        '<button onclick="location.reload()">Try again</button>';
    }

    function turnAround() {
      document.getElementById("text").innerText =
        "There is nothing there. You probably imagined it.";

      document.getElementById("buttons").innerHTML =
        '<button onclick="location.reload()">Start over</button>';
    }
  </script>

</body>
</html>
